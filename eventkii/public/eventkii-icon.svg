<svg width="120" height="120" viewBox="0 0 120 120" xmlns="http://www.w3.org/2000/svg">
  <!-- Background -->
  <rect width="120" height="120" fill="#1A1A1A" rx="20"/>
  
  <!-- Simplified Key-Ticket Icon -->
  <g transform="translate(20, 25)">
    <!-- Ticket portion (top part of key) -->
    <rect x="0" y="0" width="80" height="28" rx="3" fill="#B2FF59"/>
    
    <!-- Perforated edges -->
    <g fill="#1A1A1A">
      <!-- Left perforations -->
      <circle cx="6" cy="7" r="1"/>
      <circle cx="6" cy="14" r="1"/>
      <circle cx="6" cy="21" r="1"/>
      
      <!-- Right perforations -->
      <circle cx="74" cy="7" r="1"/>
      <circle cx="74" cy="14" r="1"/>
      <circle cx="74" cy="21" r="1"/>
      
      <!-- Center separation -->
      <rect x="38" y="10" width="4" height="8" rx="2"/>
    </g>
    
    <!-- Key shaft -->
    <rect x="30" y="28" width="20" height="35" fill="#FFC93C"/>
    
    <!-- Key teeth -->
    <g fill="#FFC93C">
      <rect x="50" y="38" width="12" height="6"/>
      <rect x="50" y="48" width="10" height="6"/>
      <rect x="50" y="58" width="14" height="5"/>
    </g>
    
    <!-- Subtle circuit elements -->
    <g stroke="#1A1A1A" stroke-width="0.8" fill="none" opacity="0.15">
      <circle cx="15" cy="8" r="1.5"/>
      <circle cx="25" cy="20" r="1.5"/>
      <line x1="15" y1="8" x2="25" y2="20"/>
    </g>
  </g>
  
  <!-- Minimal glow effect -->
  <defs>
    <filter id="iconGlow">
      <feGaussianBlur stdDeviation="2" result="coloredBlur"/>
      <feMerge> 
        <feMergeNode in="coloredBlur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>
</svg>